<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 For Special Person 🎁</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3
    );

    font-family: 'Segoe UI', sans-serif;

    padding: 20px;
}


/* =========================
   CARD
========================= */

.card {
    width: 100%;
    max-width: 420px;

    background: white;

    padding: 25px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
}


/* =========================
   HEADING
========================= */

.card h2 {
    margin-top: 0;

    color: #ff4e50;

    font-size: 25px;

    line-height: 1.4;
}

.card h4 {
    color: #777;

    font-weight: normal;

    margin-bottom: 20px;

    line-height: 1.5;
}


/* =========================
   FLIP CONTAINER
========================= */

.flip-box {

    width: 280px;
    height: 280px;

    margin: 20px auto;

    perspective: 1000px;
}


/* =========================
   FLIP INNER
========================= */

.flip-inner {

    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition: transform 0.8s ease;
}


/* Flip */

.flip {
    transform: rotateY(180deg);
}


/* =========================
   FRONT & BACK
========================= */

.flip-front,
.flip-back {

    position: absolute;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    border-radius: 15px;

    overflow: hidden;

    backface-visibility: hidden;

    background: white;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   GIFT IMAGE
========================= */

.flip-front img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: white;
}


/* =========================
   COUPLE IMAGE
========================= */

.flip-back {

    transform: rotateY(180deg);
}

.flip-back img {

    width: 100%;
    height: 100%;

    /*
       contain = poori image visible
       crop nahi hogi
    */

    object-fit: contain;

    background: white;
}


/* =========================
   BUTTON
========================= */

button {

    background: linear-gradient(
        45deg,
        #ff4e50,
        #ff758c
    );

    color: white;

    border: none;

    padding: 12px 30px;

    border-radius: 25px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    transition: 0.3s ease;

    box-shadow:
        0 5px 15px rgba(255,78,80,0.3);
}


button:hover {

    transform: scale(1.05);

    box-shadow:
        0 8px 20px rgba(255,78,80,0.4);
}


button:active {

    transform: scale(0.95);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

    .card {
        padding: 20px 15px;
    }

    .card h2 {
        font-size: 22px;
    }

    .card h4 {
        font-size: 14px;
    }

    .flip-box {

        width: 250px;
        height: 250px;

    }

}


/* Extra small phones */

@media (max-width: 350px) {

    .flip-box {

        width: 220px;
        height: 220px;

    }

}

</style>

</head>


<body>


<div class="card">

    <h2>
        🎉 Happy Birthday 🎉
        <br>
        🎉 Only For You 🎉
    </h2>


    <h4>
        "Just a small thing...
        for someone unforgettable. 💖"
    </h4>


    <!-- =========================
         FLIP CARD
    ========================== -->

    <div class="flip-box">

        <div
            class="flip-inner"
            id="flipCard"
        >

            <!-- FRONT -->
            <div class="flip-front">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png"
                    alt="Birthday Gift"
                >

            </div>


            <!-- BACK -->
            <div class="flip-back">

                <img
                    src="couple.jpeg"
                    alt="Special Memory"
                >

            </div>

        </div>

    </div>


    <!-- BUTTON -->

    <button onclick="flipCard()">

        🎁 Open 🎁

    </button>

</div>



<script>

/* =========================
   FLIP FUNCTION
========================= */

function flipCard() {

    const card =
        document.getElementById("flipCard");

    card.classList.toggle("flip");

}

</script>


</body>

</html>
